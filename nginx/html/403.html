<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied | OGZ Prime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%);
            color: #ffffff;
            font-family: 'Monaco', 'Consolas', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #dc2626;
            text-shadow: 0 0 30px #dc2626, 0 0 60px #dc2626;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        
        .error-message {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #ef4444;
        }
        
        .description {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.8rem 2rem;
            border: 2px solid #22c55e;
            background: transparent;
            color: #22c55e;
            text-decoration: none;
            border-radius: 4px;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn:hover {
            background: #22c55e;
            color: #0a0a0a;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.5);
        }
        
        .quantum-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: #22c55e;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 20s infinite linear;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes float {
            from {
                transform: translateY(100vh) translateX(0);
            }
            to {
                transform: translateY(-10vh) translateX(100px);
            }
        }
        
        .lock-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: shake 2s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="quantum-particles" id="particles"></div>
    
    <div class="container">
        <div class="lock-icon">🔒</div>
        <div class="error-code">403</div>
        <div class="error-message">Access Denied</div>
        <div class="description">
            The quantum security protocols have detected unauthorized access attempt.
            <br>
            This area is restricted to authenticated OGZ Prime members only.
        </div>
        <div class="actions">
            <a href="/" class="btn">Return Home</a>
            <a href="/pricing.html" class="btn">Get Access</a>
        </div>
    </div>
    
    <script>
        // Generate quantum particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
