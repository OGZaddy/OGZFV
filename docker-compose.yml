version: '3.8'

services:
  # SSL Server - Main WebSocket hub
  ssl-server:
    build: 
      context: .
      dockerfile: Dockerfile.ssl
    container_name: ogz-ssl-server
    ports:
      - "3011:3010"  # Testing on 3011, internal still 3010
    environment:
      - NODE_ENV=production
      - POLYGON_API_KEY=${POLYGON_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - ogz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TRAI Singleton - AI Assistant
  trai:
    build:
      context: .
      dockerfile: Dockerfile.trai
    container_name: ogz-trai
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - NODE_ENV=production
    volumes:
      - ./trai:/app/trai
      - ./logs:/app/logs
    networks:
      - ogz-network
    depends_on:
      - ssl-server
      - ollama
    restart: unless-stopped

  # Ollama for local AI (optional, can use remote)
  ollama:
    image: ollama/ollama:latest
    container_name: ogz-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ogz-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Multi-tenant Trading Bot
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ogz-trading-bot
    environment:
      - NODE_ENV=production
      - SSL_SERVER_URL=ws://ssl-server:3010/ws
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - ogz-network
    depends_on:
      - ssl-server
    restart: unless-stopped

  # Dashboard Server
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ogz-dashboard
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - SSL_SERVER_URL=ws://ssl-server:3010/ws
    volumes:
      - ./public:/app/public
      - ./logs:/app/logs
    networks:
      - ogz-network
    depends_on:
      - ssl-server
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ogz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - ogz-network
    depends_on:
      - ssl-server
      - dashboard
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:alpine
    container_name: ogz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ogz-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL for persistent data
  postgres:
    image: postgres:15-alpine
    container_name: ogz-postgres
    environment:
      - POSTGRES_DB=ogzprime
      - POSTGRES_USER=ogzadmin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ogz-network
    restart: unless-stopped

networks:
  ogz-network:
    driver: bridge

volumes:
  ollama-data:
  redis-data:
  postgres-data:
