global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'quantum-bot'
    static_configs:
      - targets: ['quantum-bot:3010']
    metrics_path: '/metrics'

  - job_name: 'elite-bot'
    static_configs:
      - targets: ['elite-bot:3011']
    metrics_path: '/metrics'

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:80']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['supabase-db:5432']