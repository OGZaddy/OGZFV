<!-- Add these styles to your CSS section -->
<style>
/* Base pulse animation */
@keyframes confidencePulse {
    0% {
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.4),
                    inset 0 0 10px rgba(255, 215, 0, 0.1);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.8),
                    0 0 50px rgba(255, 215, 0, 0.4),
                    inset 0 0 20px rgba(255, 215, 0, 0.2);
        transform: scale(1.05);
    }
    100% {
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.4),
                    inset 0 0 10px rgba(255, 215, 0, 0.1);
        transform: scale(1);
    }
}

/* Extreme confidence pulse (>85%) */
@keyframes extremeConfidencePulse {
    0% {
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.6),
                    0 0 40px rgba(0, 255, 136, 0.3),
                    inset 0 0 15px rgba(0, 255, 136, 0.2);
        transform: scale(1);
        border-color: rgba(0, 255, 136, 0.8);
    }
    50% {
        box-shadow: 0 0 40px rgba(0, 255, 136, 1),
                    0 0 80px rgba(0, 255, 136, 0.6),
                    0 0 120px rgba(0, 255, 136, 0.3),
                    inset 0 0 30px rgba(0, 255, 136, 0.3);
        transform: scale(1.08);
        border-color: rgba(0, 255, 136, 1);
    }
    100% {
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.6),
                    0 0 40px rgba(0, 255, 136, 0.3),
                    inset 0 0 15px rgba(0, 255, 136, 0.2);
        transform: scale(1);
        border-color: rgba(0, 255, 136, 0.8);
    }
}

/* Brain module confidence states */
.brain-module {
    transition: all 0.3s ease;
    position: relative;
    overflow: visible;
}

.brain-module.high-confidence {
    animation: confidencePulse 2s ease-in-out infinite;
    border-color: rgba(255, 215, 0, 0.6);
}

.brain-module.extreme-confidence {
    animation: extremeConfidencePulse 1.5s ease-in-out infinite;
    border-color: rgba(0, 255, 136, 1);
}

/* Confidence value glow effect */
.brain-confidence {
    transition: all 0.3s ease;
    font-size: 14px;
    font-weight: bold;
    color: #ffd700;
    margin-top: 5px;
    text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
}

.brain-confidence.high {
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.8),
                 0 0 20px rgba(0, 255, 136, 0.5);
    font-size: 16px;
    animation: textGlow 1s ease-in-out infinite alternate;
}

@keyframes textGlow {
    from { text-shadow: 0 0 10px rgba(0, 255, 136, 0.8); }
    to { text-shadow: 0 0 20px rgba(0, 255, 136, 1), 0 0 30px rgba(0, 255, 136, 0.6); }
}

/* Vote decision emphasis for high confidence */
.brain-vote {
    transition: all 0.3s ease;
}

.brain-module.high-confidence .brain-vote {
    font-size: 16px;
    font-weight: 800;
    text-shadow: 0 0 10px currentColor;
}

.brain-module.extreme-confidence .brain-vote {
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 0 15px currentColor, 0 0 25px currentColor;
    animation: votePulse 0.5s ease-in-out infinite alternate;
}

@keyframes votePulse {
    from { opacity: 0.9; }
    to { opacity: 1; }
}

/* Consensus glow for high agreement */
.consensus-display.high-confidence {
    animation: consensusGlow 2s ease-in-out infinite;
    background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.2) 0%, 
                rgba(0, 255, 136, 0.1) 100%);
}

@keyframes consensusGlow {
    0%, 100% {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    50% {
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.6),
                    0 0 60px rgba(0, 255, 136, 0.3);
    }
}

/* Ripple effect for new high-confidence signals */
.brain-module::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    border-radius: 8px;
    background: transparent;
    pointer-events: none;
}

.brain-module.signal-change::after {
    animation: ripple 1s ease-out;
}

@keyframes ripple {
    0% {
        width: 100%;
        height: 100%;
        opacity: 0;
        border: 2px solid rgba(255, 215, 0, 0.8);
    }
    50% {
        width: 150%;
        height: 150%;
        opacity: 1;
        border: 2px solid rgba(255, 215, 0, 0.4);
    }
    100% {
        width: 200%;
        height: 200%;
        opacity: 0;
        border: 2px solid rgba(255, 215, 0, 0);
    }
}
</style>

<!-- Updated JavaScript for handling confidence-based animations -->
<script>
function updateNeuralVotes(data) {
    const votes = data.votes || {};
    
    Object.keys(votes).forEach(brain => {
        const module = document.querySelector(`#${brain}Vote`).closest('.brain-module');
        const voteElement = document.getElementById(`${brain}Vote`);
        const confElement = document.getElementById(`${brain}Confidence`);
        
        if (voteElement && votes[brain]) {
            // Store previous vote to detect changes
            const previousVote = voteElement.textContent;
            
            // Update vote
            const vote = votes[brain].vote || votes[brain];
            voteElement.textContent = vote;
            voteElement.className = `brain-vote vote-${vote.toLowerCase()}`;
            
            // Update confidence with effects
            if (confElement && votes[brain].confidence !== undefined) {
                const confidence = votes[brain].confidence;
                confElement.textContent = `${confidence}%`;
                
                // Remove all effect classes first
                module.classList.remove('high-confidence', 'extreme-confidence', 'signal-change');
                confElement.classList.remove('high');
                
                // Add appropriate effect based on confidence level
                if (confidence >= 85) {
                    // EXTREME confidence - maximum visual impact
                    module.classList.add('extreme-confidence');
                    confElement.classList.add('high');
                    
                    // Play sound if you want (optional)
                    // playAlertSound();
                    
                    console.log(`🚨 EXTREME CONFIDENCE: ${brain} at ${confidence}%!`);
                } else if (confidence >= 70) {
                    // High confidence - moderate pulse
                    module.classList.add('high-confidence');
                }
                
                // Add ripple effect if vote changed
                if (previousVote !== vote && vote !== 'HOLD') {
                    module.classList.add('signal-change');
                    // Remove ripple class after animation
                    setTimeout(() => module.classList.remove('signal-change'), 1000);
                }
            }
        }
    });
    
    // Update consensus with effects
    if (data.consensus) {
        const consensusDisplay = document.querySelector('.consensus-display');
        const consensusDecision = document.getElementById('consensusDecision');
        const consensusConfidence = document.getElementById('consensusConfidence');
        const consensusAgreement = document.getElementById('consensusAgreement');
        
        if (consensusDecision) {
            consensusDecision.textContent = data.consensus.decision;
            consensusDecision.className = `consensus-decision vote-${data.consensus.decision.toLowerCase()}`;
        }
        
        if (consensusConfidence) {
            const confidence = data.consensus.confidence;
            consensusConfidence.textContent = `${confidence}% Confidence`;
            
            // Add glow effect for high consensus confidence
            if (confidence >= 75 && data.consensus.agreement >= 0.6) {
                consensusDisplay.classList.add('high-confidence');
            } else {
                consensusDisplay.classList.remove('high-confidence');
            }
        }
        
        if (consensusAgreement) {
            consensusAgreement.textContent = `Agreement: ${(data.consensus.agreement * 100).toFixed(0)}%`;
        }
    }
}

// Optional: Add sound alert for extreme confidence
function playAlertSound() {
    // Create a simple beep using Web Audio API
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = 800; // High pitch for alert
    oscillator.type = 'sine';
    gainNode.gain.value = 0.1; // Low volume
    
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.1); // Short beep
}
</script>
