# HTTP → HTTPS
server {
  listen 80;
  server_name ogzprime.com www.ogzprime.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  return 301 https://$host$request_uri;
}

# HTTPS site
server {
  listen 443 ssl http2;
  server_name ogzprime.com www.ogzprime.com;

  # SSL (certbot will fill these)
  ssl_certificate     /etc/letsencrypt/live/ogzprime.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ogzprime.com/privkey.pem;

  root  /home/trey/OGZFV-valhalla/public;
  index index.html;

  # WebSocket proxy
  location /ws {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
    proxy_pass http://127.0.0.1:3010/ws;
  }

  # API proxy
  location /api {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3010;
  }

  # Static
  location / {
    try_files $uri $uri/ =404;
  }
}