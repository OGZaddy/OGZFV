events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream definitions
    upstream ssl_server {
        server ssl-server:3010;
    }

    upstream dashboard_server {
        server dashboard:3333;
    }

    upstream ollama_server {
        server ollama:11434;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name ogzprime.com www.ogzprime.com api.ogzprime.com bot.ogzprime.com;
        return 301 https://$server_name$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name ogzprime.com www.ogzprime.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/ogzprime.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ogzprime.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Static files
        root /usr/share/nginx/html;
        index master-dashboard.html index.html;

        # Main site
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Dashboard
        location /dashboard {
            try_files /master-dashboard.html =404;
        }

        # WebSocket proxy to SSL server
        location /ws {
            proxy_pass http://ssl_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API proxy
        location /api/ {
            proxy_pass http://ssl_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ollama proxy for TRAI
        location /ollama/ {
            proxy_pass http://ollama_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # API subdomain
    server {
        listen 443 ssl http2;
        server_name api.ogzprime.com;

        ssl_certificate /etc/letsencrypt/live/ogzprime.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ogzprime.com/privkey.pem;

        location / {
            proxy_pass http://ssl_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Bot subdomain for WebSocket
    server {
        listen 443 ssl http2;
        server_name bot.ogzprime.com;

        ssl_certificate /etc/letsencrypt/live/ogzprime.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ogzprime.com/privkey.pem;

        location / {
            proxy_pass http://ssl_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}