<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGZPrime Ultimate - Redirecting to Dashboard...</title>
    <style>
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #0f1419 50%, #1a1f2e 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
        }
        .loading h1 {
            color: #00ff88;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0,255,136,0.3);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Redirect to unified dashboard
        setTimeout(() => {
            window.location.href = '/unified-dashboard.html';
        }, 1000);
    </script>
</head>
<body>
    <div class="loading">
        <h1>🚀 OGZPrime Ultimate</h1>
        <div class="spinner"></div>
        <p>Redirecting to trading dashboard...</p>
    </div>
</body>
</html>
